<h1>Commission Requests</h1>

{% if commissions %}
    <ul>
    {% for commission in commissions %}
        <li>
            <a href="{% url 'commissions:commission_specific' commission.pk %}">
                {{commission.title}}
            </a>
                
        </li>
    {% endfor %}
    </ul>
{% else %}
    <p>No commissions available.</p>
{% endif %}
