<h1>{% if object %}Update Event{% else %}Host a New Event{% endif %}</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if object %}Save Changes{% else %}Create Event{% endif %}</button>
</form>

<br>
<a href="{% url 'localevents:event-list' %}">Back to Events</a>
