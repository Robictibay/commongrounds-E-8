{% extends 'base.html' %}
{% block title %}Project Detail{% endblock %}
{% block content %}
<h1>{% if object %}Update Project{% else %}Create a New Project{% endif %}</h1>

    <form method= "post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form }}
        <Button type="submit">{% if object %}Save Changes{% else %}Create Project{% endif %}</button>
    </form>

<a href="{% url 'diyprojects:project-list' %}">Back to projects.</a>
{% endblock %}
